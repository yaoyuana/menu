<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>遥远的私厨</title>
    <meta
      name="description"
      content="遥远的私厨 — 点击随机菜单，让缘分决定今晚吃什么。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand-mark" href="#top">遥远的私厨</a>
      <nav class="nav">
        <a href="#menu">菜单</a>
        <a href="#about">关于</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-label="遥远的私厨">
        <div class="hero-media" aria-hidden="true">
          <img id="hero-image" src="" alt="" />
          <div class="hero-scrim"></div>
        </div>

        <div class="hero-content">
          <p class="brand">遥远的私厨</p>
          <h1>今晚，让缘分决定菜色</h1>
          <p class="lede">
            点击随机菜单，视角会跟着扫描跳动，最终锁定一道今晚的菜。
          </p>
          <div class="cta-row">
            <button type="button" class="btn btn-primary" id="random-btn">
              <span class="btn-label">随机菜单</span>
              <span class="btn-shine" aria-hidden="true"></span>
            </button>
            <a class="btn btn-ghost" href="#menu">浏览全部</a>
          </div>
        </div>
      </section>

      <section class="menu-section" id="menu">
        <div class="section-head">
          <h2>全部菜品</h2>
          <p id="menu-count">家常私厨菜单，点一张看大图，或交给随机缘分。</p>
        </div>
        <div class="menu-grid" id="menu-grid" role="list"></div>
      </section>

      <section class="about-section" id="about">
        <h2>关于遥远的私厨</h2>
        <p>
          一桌家常、一份随意。不赶时髦，只记味道——随机一抽，也是今晚的答案。
        </p>
      </section>
    </main>

    <footer class="footer">
      <span>遥远的私厨</span>
      <span>今晚吃什么，交给缘分</span>
    </footer>

    <div
      class="spotlight"
      id="spotlight"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="spotlight-title"
    >
      <div class="spotlight-backdrop" data-close></div>
      <article class="spotlight-card">
        <button type="button" class="spotlight-close" data-close aria-label="关闭">
          ×
        </button>
        <div class="spotlight-media">
          <img id="spotlight-image" alt="" />
          <div class="spotlight-ring" aria-hidden="true"></div>
        </div>
        <div class="spotlight-body">
          <p class="spotlight-tag" id="spotlight-tag">今日缘分</p>
          <h3 id="spotlight-title"></h3>
          <p id="spotlight-desc"></p>
          <div class="spotlight-meta">
            <span id="spotlight-type"></span>
          </div>
          <button type="button" class="btn btn-primary" id="again-btn">
            再抽一次
          </button>
        </div>
      </article>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
