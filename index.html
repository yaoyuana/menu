<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUMEN 私厨 · 今日菜单</title>
    <meta
      name="description"
      content="LUMEN 私厨 — 为你随机挑选今晚的主厨推荐。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand-mark" href="#top">LUMEN</a>
      <nav class="nav">
        <a href="#menu">菜单</a>
        <a href="#about">关于</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-label="LUMEN 私厨">
        <div class="hero-media" aria-hidden="true">
          <img
            id="hero-image"
            src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=1800&q=80"
            alt=""
          />
          <div class="hero-scrim"></div>
        </div>

        <div class="hero-content">
          <p class="brand">LUMEN 私厨</p>
          <h1>今晚，让缘分决定菜色</h1>
          <p class="lede">
            点击随机菜单，主厨会为你挑出一道今晚的焦点之作。
          </p>
          <div class="cta-row">
            <button type="button" class="btn btn-primary" id="random-btn">
              <span class="btn-label">随机菜单</span>
              <span class="btn-shine" aria-hidden="true"></span>
            </button>
            <a class="btn btn-ghost" href="#menu">浏览全部</a>
          </div>
        </div>
      </section>

      <section class="menu-section" id="menu">
        <div class="section-head">
          <h2>本季菜单</h2>
          <p>精选八道私厨料理，任选缘分，或逐一品味。</p>
        </div>
        <div class="menu-grid" id="menu-grid" role="list"></div>
      </section>

      <section class="about-section" id="about">
        <h2>关于 LUMEN</h2>
        <p>
          一间只为少数人开灶的私厨。食材当季，火候克制，灯光偏暗——好让味道成为今晚唯一的主角。
        </p>
      </section>
    </main>

    <footer class="footer">
      <span>LUMEN 私厨</span>
      <span>Reservation · dusk till late</span>
    </footer>

    <div
      class="spotlight"
      id="spotlight"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="spotlight-title"
    >
      <div class="spotlight-backdrop" data-close></div>
      <article class="spotlight-card">
        <button type="button" class="spotlight-close" data-close aria-label="关闭">
          ×
        </button>
        <div class="spotlight-media">
          <img id="spotlight-image" alt="" />
          <div class="spotlight-ring" aria-hidden="true"></div>
        </div>
        <div class="spotlight-body">
          <p class="spotlight-tag" id="spotlight-tag">今日缘分</p>
          <h3 id="spotlight-title"></h3>
          <p id="spotlight-desc"></p>
          <div class="spotlight-meta">
            <span id="spotlight-price"></span>
            <span id="spotlight-time"></span>
          </div>
          <button type="button" class="btn btn-primary" id="again-btn">
            再抽一次
          </button>
        </div>
      </article>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
